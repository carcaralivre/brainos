name: Something isn't working
description: A bug on the board, on brain.local, on the Install page or in the QR reader.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. The steps to make it happen are the most important part.

        Please don't paste Wi-Fi passwords, your OpenRouter key or the text of private notes.
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [On the board, brain.local, Install page, QR reader, Building or flashing]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
      placeholder: "I held OK and spoke; the note stayed on 'waiting for Wi-Fi' although About shows the network connected."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Wake the board with OK
        2. Hold OK, speak for 5 seconds, release
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: On the board, Settings → About (or the last line at the top of brain.local).
      placeholder: v0.7.6
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Serial log or photo (optional)
      description: 115200 baud, the lines around the problem. A photo of the screen helps too.
