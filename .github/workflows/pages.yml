name: Install page

# Publishes site/ with the latest release's brainos-full.bin to GitHub Pages. Runs on a push
# to main and by hand (after a release).

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Fetch the latest release's firmware
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          mkdir -p public && cp site/index.html site/manifest.json public/ && cp -R site/esp-web-tools public/esp-web-tools && cp -R site/reader public/reader
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern brainos-full.bin --dir public
          sed -i "s/VERSION/$TAG/" public/manifest.json public/index.html
          ls -l public
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: public
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        id: deploy
        continue-on-error: true
      - name: Second try, when GitHub's API hiccupped
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        if: steps.deploy.outcome == 'failure'
