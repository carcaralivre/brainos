name: Release

# Push a tag like v0.1.0: this builds that version and publishes it as a GitHub Release,
# which the board's Settings -> Update installs from (brainos.bin), and which the Install
# page flashes over USB (brainos-full.bin). A tag with a suffix (v0.2.0-rc1) is a pre-release.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Check the tag is a version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH"; exit 1; }
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
      - name: Install the ESP32 core and libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.11 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "Adafruit BusIO@1.17.4" "Adafruit GFX Library@1.12.6"
      - name: Build
        run: BUILD_DIR="$RUNNER_TEMP/build" BRAINOS_VERSION="$GITHUB_REF_NAME" firmware/build.sh build
      - name: Make the release files
        run: |
          set -euo pipefail
          B="$RUNNER_TEMP/build"
          mkdir -p dist
          cp "$B/brainos.ino.bin" dist/brainos.bin
          (cd dist && sha256sum brainos.bin > brainos.bin.sha256)
          ESPTOOL=$(find ~/.arduino15/packages/esp32/tools/esptool_py -name esptool -type f | head -1)
          "$ESPTOOL" --chip esp32s3 merge-bin -o dist/brainos-full.bin \
            --flash-mode keep --flash-freq keep --flash-size keep \
            0x0 "$B/brainos.ino.bootloader.bin" 0x8000 "$B/brainos.ino.partitions.bin" 0xe000 "$B/boot_app0.bin" 0x10000 "$B/brainos.ino.bin"
          (cd dist && sha256sum brainos-full.bin > brainos-full.bin.sha256)
          strings dist/brainos.bin | grep -q "^$GITHUB_REF_NAME$" || { echo "the version string isn't in the image"; exit 1; }
          if strings dist/brainos.bin | grep -Eq 'sk-or-[A-Za-z0-9_-]{20,}'; then echo "the image holds an API key"; exit 1; fi
          ls -l dist
      - name: Release notes
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = tag ]; then git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > dist/notes.md; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -s dist/notes.md ]; then NOTES=(--notes-file dist/notes.md); else NOTES=(--generate-notes); fi
          KIND=(); if [[ "$GITHUB_REF_NAME" == *-* ]]; then KIND=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "BrainOS $GITHUB_REF_NAME" "${NOTES[@]}" "${KIND[@]}" --verify-tag \
            dist/brainos.bin dist/brainos.bin.sha256 dist/brainos-full.bin dist/brainos-full.bin.sha256

  pages:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release
          path: dist
      - name: Assemble the install page with the new firmware
        run: |
          mkdir -p public && cp site/index.html site/manifest.json public/ && cp dist/brainos-full.bin public/
          sed -i "s/VERSION/$GITHUB_REF_NAME/" public/manifest.json public/index.html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: public
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
